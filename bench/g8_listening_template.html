<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Écoute à l’aveugle · Akasha G8</title>
<style>
*{box-sizing:border-box}body{font:17px/1.5 system-ui,sans-serif;color:#172729;background:#f5f6f1;margin:auto;max-width:980px;padding:24px}
h1{font-size:2.2rem;line-height:1.1}h2{font-size:1.22rem;margin:0}section{background:white;border:1px solid #bac7bf;border-radius:12px;padding:20px;margin-bottom:18px}
.clips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:18px;margin:20px 0}audio{width:100%;display:block;margin-top:5px}
input,select,button{font:inherit;padding:6px;margin:4px}button{background:#184f43;color:white;border:0;padding:12px 18px;border-radius:7px;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c35d10}
</style>
<main><h1>Quelle lecture te semble la plus naturelle ?</h1>
<p>Écoute les trois versions de chaque phrase. Les lettres changent de sens d’une phrase à l’autre.
{{consigne}}</p>
<form>{{clips}}
<button type="submit">Enregistrer mes réponses</button> <span role="status" id="status"></span>
</form></main>
<script>
document.addEventListener('play',event=>{
  for(const other of document.querySelectorAll('audio')) if(other!==event.target) other.pause();
},true);
document.querySelector('form').addEventListener('submit',event=>{
  event.preventDefault();
  const reponses=[1,2,3].map(phrase=>({phrase,choix:document.getElementById('p'+phrase).value,
    remarque:document.getElementById('r'+phrase).value}));
  const file=new Blob([JSON.stringify({lot:'{{lot}}',reponses},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(file), link=document.createElement('a');
  link.href=url;link.download='ecoute-g8-{{lot}}-reponses.json';link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  document.getElementById('status').textContent='Fichier de réponses prêt à joindre au chat.';
});
</script></html>
